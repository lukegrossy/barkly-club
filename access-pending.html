<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>School access | Barkly</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="auth-screen">
    <section class="auth-panel">
      <img src="assets/barkly-logo.png" alt="Barkly" class="auth-logo-small" />
      <div class="auth-copy">
        <h1>Your account is ready</h1>
        <p>Your puppy school still needs to connect your account. Once they have done that, log in to see your school.</p>
      </div>
      <button class="btn btn-secondary" id="signOut" type="button">Log out</button>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
