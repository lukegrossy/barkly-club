<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Class Detail | Barkly Schools</title>

<link rel="stylesheet" href="design-system.css" />

<style>

body{
  padding:max(26px, env(safe-area-inset-top)) 20px 110px;
}

.dashboard{
  max-width:var(--content-width);
  margin:0 auto;
}

.topbar{
  display:flex;
  align-items:flex-start;
  gap:16px;
  margin-bottom:var(--space-xl);
}

.back-btn{
  width:44px;
  height:44px;
  border:none;
  border-radius:999px;
  background:rgba(15,31,46,.08);
  display:grid;
  place-items:center;
  color:var(--navy);
  flex-shrink:0;
}

.hero{
  padding:24px;
  margin-bottom:var(--space-xl);
}

.hero-pill{
  background:rgba(255,255,255,.14);
  color:white;
}

.hero h1{
  color:white;
  margin-top:14px;
  margin-bottom:10px;
  font-size:var(--display-md);
  line-height:1.02;
}

.hero p{
  color:rgba(255,255,255,.76);
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:var(--space-xl);
}

.stat-card{
  padding:18px;
}

.stat-card p{
  color:var(--text-secondary);
  font-size:var(--text-sm);
  margin-bottom:8px;
}

.stat-card strong{
  font-size:var(--display-sm);
}

.card-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.detail-card{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px;
}

.card-icon{
  width:48px;
  height:48px;
  border-radius:var(--radius-md);
  background:rgba(138,166,143,.12);
  color:var(--sage);
  display:grid;
  place-items:center;
}

.card-icon svg{
  width:22px;
  height:22px;
}

.detail-card h4{
  margin-bottom:4px;
}

.detail-card p{
  color:var(--text-secondary);
  font-size:var(--text-sm);
}

.cta{
  width:100%;
  height:56px;
  border:none;
  border-radius:999px;
  background:var(--navy);
  color:white;
  font-weight:700;
  margin-top:20px;
}

</style>
</head>

<body>

<main class="dashboard fade-in">

  <div class="topbar">

    <button
      class="back-btn"
      onclick="window.location='owner-dashboard.html'"
    >
      <i data-lucide="arrow-left"></i>
    </button>

    <div>
      <p class="eyebrow">Barkly Schools</p>
    </div>

  </div>

  <section class="hero hero-card lift-card">

    <span class="pill hero-pill" id="classStatus">
      Active
    </span>

    <h1 id="className">
      Loading...
    </h1>

    <p id="classSub">
      Loading...
    </p>

  </section>

  <div class="stats-grid">

    <div class="stat-card glass-card lift-card">
      <p>Enrolled</p>
      <strong id="enrolledCount">0</strong>
    </div>

    <div class="stat-card glass-card lift-card">
      <p>Capacity</p>
      <strong id="capacityCount">0</strong>
    </div>

  </div>

  <div class="card-list">

    <div class="detail-card glass-card lift-card">
      <div class="card-icon">
        <i data-lucide="layers-3"></i>
      </div>

      <div>
        <h4>Program</h4>
        <p id="programName">Loading...</p>
      </div>
    </div>

    <div class="detail-card glass-card lift-card">
      <div class="card-icon">
        <i data-lucide="map-pin"></i>
      </div>

      <div>
        <h4>Location</h4>
        <p id="locationName">Loading...</p>
      </div>
    </div>

    <div class="detail-card glass-card lift-card">
      <div class="card-icon">
        <i data-lucide="users"></i>
      </div>

      <div>
        <h4>Capacity Remaining</h4>
        <p id="capacityRemaining">Loading...</p>
      </div>
    </div>

  </div>

  <button class="cta">
    Manage Enrolments
  </button>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>

const SUPABASE_URL =
"https://woolaaiunapsaowheifj.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvb2xhYWl1bmFwc2Fvd2hlaWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMjAyNDEsImV4cCI6MjA5NTU5NjI0MX0.eBebW92-UHQVM8asBA6SwJql9s5DHgqhd0BlC00bUkc";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function loadClass() {

  const { data, error } = await db
    .from("owner_class_detail_view")
    .select("*")
    .limit(1)
    .single();

  if(error){
    console.error(error);
    return;
  }

  document.getElementById("className").textContent =
    data.class_name;

  document.getElementById("classSub").textContent =
    `${data.program_name} · ${data.location}`;

  document.getElementById("classStatus").textContent =
    data.status;

  document.getElementById("programName").textContent =
    data.program_name;

  document.getElementById("locationName").textContent =
    data.location;

  document.getElementById("enrolledCount").textContent =
    data.enrolled_count;

  document.getElementById("capacityCount").textContent =
    data.capacity;

  document.getElementById("capacityRemaining").textContent =
    `${data.capacity - data.enrolled_count} places available`;
}

loadClass();

lucide.createIcons();

</script>

</body>
</html>
