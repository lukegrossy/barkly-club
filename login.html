<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Log in | Barkly</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <main class="auth-screen">

    <header class="auth-header">
      <a href="index.html" class="back-link">
        ←
      </a>
    </header>

    <section class="auth-panel">

      <img
        src="assets/barkly-logo.png"
        alt="Barkly"
        class="auth-logo-small"
      />

      <div class="auth-copy">
        <h1>Welcome back</h1>

        <p>
          Good to see you again.
        </p>
      </div>

      <form class="auth-form" id="loginForm">

        <label>
          Email

          <input
            type="email"
            name="email"
            required
            placeholder="you@example.com"
            autocomplete="email"
          />
        </label>

        <label>
          Password

          <input
            type="password"
            name="password"
            required
            placeholder="Enter your password"
            autocomplete="current-password"
          />
        </label>

        <button type="submit" class="btn btn-primary">
          Log in
        </button>

      </form>
      <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>
      <button id="forgotPassword" class="btn btn-secondary" type="button">Forgot password?</button>
      <section id="resetPanel" hidden>
        <h2>Reset your password</h2>
        <form id="resetForm" class="auth-form"><label>Email<input type="email" name="email" autocomplete="email" required></label><button class="btn btn-primary">Send reset link</button></form>
      </section>
      <section id="recoveryPanel" hidden>
        <form id="recoveryForm" class="auth-form"><label>New password<input type="password" name="password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required></label><button class="btn btn-primary">Save new password</button></form>
        <button id="requestNewReset" class="btn btn-secondary" type="button">Request another reset link</button>
      </section>

      <p class="auth-switch">
        New to Barkly?
        <a href="create-account.html">Create account</a>
      </p>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script src="invite-state.js?v=setup-2"></script><script src="app.js?v=setup-2"></script>

</body>
</html>
