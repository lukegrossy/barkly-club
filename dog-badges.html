<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dog Badges | Barkly Schools</title>

  <link rel="stylesheet" href="design-system.css" />

  <style>
    body {
      padding: max(26px, env(safe-area-inset-top)) 20px 110px;
    }

    .dashboard {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .eyebrow {
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      color: var(--sage);
      margin: 0;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.72);
      border: 1.5px solid var(--glass-border);
      color: var(--navy);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
    }

    .page-title {
      font-size: var(--display-md);
      line-height: 1;
      margin-bottom: 8px;
    }

    .page-subtitle {
      color: var(--text-secondary);
      margin-bottom: var(--space-xl);
    }

    .hero {
      padding: 24px;
      margin-bottom: var(--space-xl);
      color: white;
    }

    .hero h2 {
      color: white;
      margin-bottom: 8px;
    }

    .hero p {
      color: rgba(255,255,255,.75);
    }

    .section-title {
      font-size: var(--text-xl);
      margin-bottom: var(--space-sm);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }

    .badge-card {
      display: flex;
      gap: 14px;
      padding: 18px;
      align-items: flex-start;
    }

    .badge-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .badge-icon svg {
      width: 26px;
      height: 26px;
      stroke-width: 2.2;
    }

    .earned .badge-icon {
      background: rgba(138,166,143,.15);
      color: var(--sage);
    }

    .locked .badge-icon {
      background: rgba(15,31,46,.08);
      color: var(--text-secondary);
    }

    .badge-copy {
      flex: 1;
    }

    .badge-copy h4 {
      margin-bottom: 6px;
      font-size: 16px;
    }

    .badge-description {
      color: var(--text-secondary);
      font-size: var(--text-sm);
      margin-bottom: 10px;
      line-height: 1.45;
    }

    .badge-comment {
      font-size: var(--text-sm);
      color: var(--navy);
      padding-top: 10px;
      border-top: 1px solid rgba(0,0,0,.06);
    }

    .badge-date {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .locked {
      opacity: .72;
    }

    .empty-card {
      padding: 18px;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.5;
    }

    .award-panel {
      display: none;
      padding: 18px;
      margin-bottom: var(--space-xl);
    }

    body[data-role="owner"] .award-panel,
    body[data-role="trainer"] .award-panel {
      display: block;
    }

    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: var(--space-md);
    }

    .chip {
      border: 1.5px solid var(--glass-border);
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.68);
      padding: 11px 14px;
      color: var(--navy);
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
    }

    .chip.selected {
      background: var(--navy);
      color: white;
      border-color: var(--navy);
    }

    .note-box {
      width: 100%;
      min-height: 92px;
      resize: vertical;
      border: 1.5px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.72);
      padding: 14px;
      font-family: var(--font-family);
      font-size: var(--text-md);
      outline: none;
      margin-bottom: var(--space-md);
    }

    .award-btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--navy);
      color: white;
      font-size: var(--text-md);
      font-weight: var(--font-heavy);
    }

    .bottom-nav {
      max-width: 540px;
    }

    .bottom-nav-item {
      min-width: 62px;
    }

    body[data-role="trainer"] .bottom-nav {
      max-width: 340px;
    }

    body[data-role="trainer"] .bottom-nav-item {
      min-width: 96px;
    }
  </style>
</head>

<body data-role="owner">

<main class="dashboard fade-in">

  <div class="brand-row">
    <button class="back-btn" id="backBtn">
      ←
    </button>

    <img src="assets/barkly-icon.png" alt="Barkly" class="header-icon" />
    <p class="eyebrow">Barkly Schools</p>
  </div>

  <h1 class="page-title">Badges</h1>

  <p class="page-subtitle" id="pageSubtitle">
    Achievements and training milestones.
  </p>

  <section class="hero hero-card lift-card">
    <h2 id="dogName">Loading...</h2>
    <p id="heroStats">Loading badges...</p>
  </section>

  <section class="award-panel glass-card lift-card" id="awardPanel">
    <h3 class="section-title">Award badge</h3>

    <div class="chip-grid" id="awardBadgeChoices">
      <button class="chip selected" type="button">
        Loading badges...
      </button>
    </div>

    <textarea
      class="note-box"
      id="awardComment"
      placeholder="Optional trainer comment for the parent portal."
    ></textarea>

    <button class="award-btn" id="awardBadgeButton" type="button">
      Award selected badge
    </button>
  </section>

  <h3 class="section-title">Earned badges</h3>

  <div class="card-list" id="earnedBadges">
    <div class="empty-card glass-card">
      Loading earned badges...
    </div>
  </div>

  <h3 class="section-title">Next milestones</h3>

  <div class="card-list" id="lockedBadges">
    <div class="empty-card glass-card">
      Loading milestones...
    </div>
  </div>

</main>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
const SUPABASE_URL =
  "https://woolaaiunapsaowheifj.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvb2xhYWl1bmFwc2Fvd2hlaWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMjAyNDEsImV4cCI6MjA5NTU5NjI0MX0.eBebW92-UHQVM8asBA6SwJql9s5DHgqhd0BlC00bUkc";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentDog = null;
let selectedAwardBadgeId = null;
let selectedAwardBadgeName = null;

function getParams() {
  return new URLSearchParams(window.location.search);
}

function getRole() {
  const role = getParams().get("role");
  return ["owner", "trainer", "parent"].includes(role) ? role : "owner";
}

function getDogId() {
  return getParams().get("dog");
}

function withRoleAndDog(page, dogId) {
  return `${page}?role=${role}&dog=${dogId}`;
}

const role = getRole();
const dogId = getDogId();

document.body.dataset.role = role;

function renderRoleCopy() {
  if (role === "owner") {
    document.getElementById("pageSubtitle").textContent =
      "View badges and award new achievements.";
  }

  if (role === "trainer") {
    document.getElementById("pageSubtitle").textContent =
      "View badges and award new achievements.";
  }

  if (role === "parent") {
    document.getElementById("pageSubtitle").textContent =
      "Celebrate your dog's training achievements.";
  }
}

function renderBottomNav() {
  const nav = document.getElementById("bottomNav");

  if (role === "owner") {
    nav.innerHTML = `
      <a href="owner-dashboard.html" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="layout-dashboard"></i></div>
        Home
      </a>

      <a href="owner-dashboard.html#programs" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="layers-3"></i></div>
        Programs
      </a>

      <a href="dogs.html?role=owner" class="bottom-nav-item active">
        <div class="bottom-nav-icon"><i data-lucide="users"></i></div>
        People
      </a>

      <a href="owner-dashboard.html#school" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="building-2"></i></div>
        School
      </a>
    `;
  }

  if (role === "trainer") {
    nav.innerHTML = `
      <a href="trainer-dashboard.html" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="calendar-check"></i></div>
        Sessions
      </a>

      <a href="trainer-dashboard.html#dogs" class="bottom-nav-item active">
        <div class="bottom-nav-icon"><i data-lucide="dog"></i></div>
        Dogs
      </a>
    `;
  }

  if (role === "parent") {
    nav.innerHTML = `
      <a href="dog-detail.html?role=parent&dog=${dogId || ""}" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="dog"></i></div>
        Dog
      </a>

      <a href="dog-sessions.html?role=parent&dog=${dogId || ""}" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="calendar-check"></i></div>
        Sessions
      </a>

      <a href="parent-school.html" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="building-2"></i></div>
        School
      </a>
    `;
  }
}

function setBackButton() {
  document.getElementById("backBtn").onclick = () => {
    if (dogId) {
      window.location = withRoleAndDog("dog-detail.html", dogId);
      return;
    }

    if (role === "owner") {
      window.location = "dogs.html?role=owner";
      return;
    }

    if (role === "trainer") {
      window.location = "dogs.html?role=trainer";
      return;
    }

    if (role === "parent") {
      window.location = "parent-dashboard.html";
      return;
    }

    window.location = "dogs.html";
  };
}

function badgeIcon(name, icon) {
  if (icon) return icon;

  switch (name) {
    case "First Session":
      return "sparkles";
    case "Recall Rookie":
      return "radio";
    case "Lead Walker":
      return "footprints";
    case "Social Star":
      return "star";
    case "Graduate":
      return "badge-check";
    case "Off Leash Ready":
      return "lock";
    default:
      return "award";
  }
}

async function loadDogRecord() {
  if (!dogId) return null;

  const { data, error } = await db
    .from("dogs")
    .select("id, school_id, name")
    .eq("id", dogId)
    .single();

  if (error) {
    console.error("Dog lookup failed:", error);
    return null;
  }

  currentDog = data;
  return data;
}

async function loadAwardBadgeChoices() {

  if (!(role === "owner" || role === "trainer")) return;

  const choices =
    document.getElementById("awardBadgeChoices");

  if (!currentDog?.school_id) {

    choices.innerHTML = `
      <button class="chip selected" type="button">
        No school linked
      </button>
    `;

    return;
  }

  const { data, error } = await db
    .from("badge_templates")
    .select("id, name")
    .eq("school_id", currentDog.school_id)
    .eq("is_active", true)
    .order("sort_order", { ascending: true });

  if (error) {

    console.error("Badge templates failed:", error);

    choices.innerHTML = `
      <button class="chip selected" type="button">
        Could not load badges
      </button>
    `;

    return;
  }

  const { data: awardedBadges, error: awardedError } =
    await db
      .from("dog_badges")
      .select("badge_template_id")
      .eq("dog_id", currentDog.id);

  if (awardedError) {
    console.error(
      "Awarded badges lookup failed:",
      awardedError
    );
  }

  const awardedBadgeIds = new Set(
    (awardedBadges || []).map(
      row => row.badge_template_id
    )
  );

  const availableBadges =
    (data || []).filter(
      badge => !awardedBadgeIds.has(badge.id)
    );

  if (!availableBadges.length) {

    choices.innerHTML = `
      <button class="chip selected" type="button">
        All badges already awarded
      </button>
    `;

    document.getElementById(
      "awardBadgeButton"
    ).disabled = true;

    return;
  }

  document.getElementById(
    "awardBadgeButton"
  ).disabled = false;

  selectedAwardBadgeId =
    availableBadges[0].id;

  selectedAwardBadgeName =
    availableBadges[0].name;

  choices.innerHTML =
    availableBadges.map(
      (badge, index) => `
        <button
          class="chip ${
            index === 0 ? "selected" : ""
          }"
          type="button"
          data-badge-id="${badge.id}"
          data-badge-name="${badge.name}"
        >
          ${badge.name}
        </button>
      `
    ).join("");

  document
    .querySelectorAll(
      "#awardBadgeChoices .chip"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        event => {

          event.preventDefault();

          document
            .querySelectorAll(
              "#awardBadgeChoices .chip"
            )
            .forEach(chip =>
              chip.classList.remove(
                "selected"
              )
            );

          button.classList.add(
            "selected"
          );

          selectedAwardBadgeId =
            button.dataset.badgeId;

          selectedAwardBadgeName =
            button.dataset.badgeName;
        }
      );
    });
}

async function awardSelectedBadge() {

  if (
    !(role === "owner" || role === "trainer")
  ) {
    return;
  }

  if (
    !currentDog?.id ||
    !currentDog?.school_id
  ) {
    alert("No dog selected.");
    return;
  }

  if (!selectedAwardBadgeId) {
    alert("Select a badge first.");
    return;
  }

  const comment =
    document
      .getElementById("awardComment")
      ?.value
      ?.trim() ||
    `${selectedAwardBadgeName} awarded to ${currentDog.name}.`;

  const { error } = await db
    .from("dog_badges")
    .insert({
      school_id: currentDog.school_id,
      dog_id: currentDog.id,
      badge_template_id:
        selectedAwardBadgeId,
      trainer_comment: comment
    });

  if (error) {

    console.error(
      "Award badge failed:",
      error
    );

    alert(
      "Could not award badge. It may already exist."
    );

    return;
  }

  document.getElementById(
    "awardComment"
  ).value = "";

  await loadBadges();
}

document
  .getElementById(
    "awardBadgeButton"
  )
  .addEventListener(
    "click",
    awardSelectedBadge
  );

loadBadges();
lucide.createIcons();
</script>

</body>
</html>
