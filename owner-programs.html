<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Programs | Barkly Schools</title>

  <link rel="stylesheet" href="design-system.css" />

  <style>
    body {
      padding: max(26px, env(safe-area-inset-top)) 20px 110px;
    }

    .dashboard {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .eyebrow {
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      color: var(--sage);
      margin: 0;
    }

    .page-title {
      font-size: var(--display-md);
      line-height: 1;
      margin-bottom: 8px;
    }

    .page-subtitle {
      color: var(--text-secondary);
      margin-bottom: var(--space-xl);
      line-height: 1.5;
    }

    .action-row {
      margin-bottom: var(--space-lg);
    }

    .new-btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--navy);
      color: white;
      font-size: var(--text-md);
      font-weight: var(--font-heavy);
      box-shadow: var(--shadow-soft);
    }

    .section-title {
      font-size: var(--text-xl);
      margin-bottom: var(--space-sm);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }

    .program-card {
      display: block;
      padding: 18px;
      text-decoration: none;
      color: inherit;
    }

    .program-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .program-title {
      font-size: 18px;
      font-weight: var(--font-heavy);
      color: var(--navy);
      margin-bottom: 5px;
    }

    .program-desc {
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.45;
    }

    .status-pill {
      padding: 7px 11px;
      border-radius: var(--radius-pill);
      background: rgba(138,166,143,.12);
      color: var(--sage);
      font-size: var(--text-xs);
      font-weight: var(--font-heavy);
      text-transform: capitalize;
      flex-shrink: 0;
    }

    .program-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .meta-pill {
      padding: 8px 10px;
      border-radius: var(--radius-pill);
      background: rgba(15,31,46,.05);
      color: var(--text-secondary);
      font-size: var(--text-xs);
      font-weight: var(--font-heavy);
    }

    .empty-card {
      padding: 18px;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.5;
    }

    .bottom-nav {
      max-width: 540px;
    }

    .bottom-nav-item {
      min-width: 62px;
    }
  </style>
</head>

<body>

<main class="dashboard fade-in">

  <div class="brand-row">
    <img src="assets/barkly-icon.png" alt="Barkly" class="header-icon" />
    <p class="eyebrow">Barkly Schools</p>
  </div>

  <h1 class="page-title">Programs</h1>

  <p class="page-subtitle">
    Configure the training programs your school runs.
  </p>

  <div class="action-row">
    <button class="new-btn" type="button" onclick="alert('New Program coming soon.')">
      + New Program
    </button>
  </div>

  <h3 class="section-title">Active programs</h3>

  <div class="card-list" id="programList">
    <div class="empty-card glass-card">
      Loading programs...
    </div>
  </div>

</main>

<nav class="bottom-nav">

  <a href="owner-dashboard.html" class="bottom-nav-item">
    <div class="bottom-nav-icon">
      <i data-lucide="layout-dashboard"></i>
    </div>
    Home
  </a>

  <a href="owner-programs.html" class="bottom-nav-item active">
    <div class="bottom-nav-icon">
      <i data-lucide="layers-3"></i>
    </div>
    Programs
  </a>

  <a href="owner-dogs.html" class="bottom-nav-item">
    <div class="bottom-nav-icon">
      <i data-lucide="users"></i>
    </div>
    People
  </a>

  <a href="owner-dashboard.html#school" class="bottom-nav-item">
    <div class="bottom-nav-icon">
      <i data-lucide="building-2"></i>
    </div>
    School
  </a>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
const SUPABASE_URL =
  "https://woolaaiunapsaowheifj.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Indvb2xhYWl1bmFwc2Fvd2hlaWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMjAyNDEsImV4cCI6MjA5NTU5NjI0MX0.eBebW92-UHQVM8asBA6SwJql9s5DHgqhd0BlC00bUkc";
</script>

<script>
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function safe(value, fallback = "") {
  return value ?? fallback;
}

function programSessions(program) {
  return (
    program.session_count ||
    program.total_sessions ||
    program.sessions_required ||
    6
  );
}

function programStatus(program) {
  if (program.status) return program.status;
  if (program.is_active === false) return "inactive";
  return "active";
}

function renderProgram(program) {
  const name =
    safe(program.name, program.title || "Training Program");

  const description =
    safe(program.description, "Program description to be added.");

  const sessions =
    programSessions(program);

  const status =
    programStatus(program);

  const id =
    program.id || "";

  return `
    <a href="owner-program-detail.html?program=${id}" class="program-card glass-card lift-card">
      <div class="program-top">
        <div>
          <div class="program-title">${name}</div>
          <div class="program-desc">${description}</div>
        </div>

        <div class="status-pill">${status}</div>
      </div>

      <div class="program-meta">
        <div class="meta-pill">${sessions} sessions</div>
        <div class="meta-pill">Classes</div>
        <div class="meta-pill">Badges</div>
        <div class="meta-pill">Homework</div>
      </div>
    </a>
  `;
}

async function loadPrograms() {
  const list = document.getElementById("programList");

  const { data, error } = await db
    .from("programs")
    .select("*")
    .order("name", { ascending: true });

  if (error) {
    console.error("Programs failed:", error);

    list.innerHTML = `
      <div class="empty-card glass-card">
        Could not load programs. Check the programs table exists in Supabase.
      </div>
    `;

    lucide.createIcons();
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = `
      <div class="empty-card glass-card">
        No programs created yet. Add Puppy Foundations, Recall Workshop or another school program.
      </div>
    `;

    lucide.createIcons();
    return;
  }

  list.innerHTML =
    data.map(renderProgram).join("");

  lucide.createIcons();
}

loadPrograms();
lucide.createIcons();
</script>

</body>
</html>
