<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Session History | Barkly Schools</title>

  <link rel="stylesheet" href="design-system.css" />

  <style>
    body {
      padding: max(26px, env(safe-area-inset-top)) 20px 110px;
    }

    .dashboard {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .eyebrow {
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      color: var(--sage);
      margin: 0;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.72);
      border: 1.5px solid var(--glass-border);
      color: var(--navy);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
    }

    .page-title {
      font-size: var(--display-md);
      line-height: 1;
      margin-bottom: 8px;
    }

    .page-subtitle {
      color: var(--text-secondary);
      margin-bottom: var(--space-xl);
    }

    .hero {
      padding: 24px;
      margin-bottom: var(--space-xl);
      color: white;
    }

    .hero h2 {
      color: white;
      margin-bottom: 8px;
    }

    .hero p {
      color: rgba(255,255,255,.75);
    }

    .section-title {
      font-size: var(--text-xl);
      margin-bottom: var(--space-sm);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }

    .session-card {
      padding: 18px;
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      gap: 12px;
    }

    .session-title {
      font-size: 16px;
      font-weight: var(--font-heavy);
      line-height: 1.2;
    }

    .status-pill {
      background: rgba(138,166,143,.12);
      color: var(--sage);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: var(--font-heavy);
      text-transform: capitalize;
      flex-shrink: 0;
    }

    .session-meta {
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.5;
    }

    .empty-card {
      padding: 18px;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.5;
    }

    .bottom-nav {
      max-width: 540px;
    }

    .bottom-nav-item {
      min-width: 92px;
    }

    body[data-role="trainer"] .bottom-nav {
      max-width: 340px;
    }

    body[data-role="trainer"] .bottom-nav-item {
      min-width: 96px;
    }
  </style>
</head>

<body data-role="owner">

<main class="dashboard fade-in">

  <div class="brand-row">
    <button class="back-btn" id="backBtn">
      ←
    </button>

    <img src="assets/barkly-icon.png" alt="Barkly" class="header-icon" />
    <p class="eyebrow">Barkly Schools</p>
  </div>

  <h1 class="page-title">Session History</h1>

  <p class="page-subtitle" id="pageSubtitle">
    Training attendance and progress.
  </p>

  <section class="hero hero-card lift-card">
    <h2 id="dogName">Loading...</h2>

    <p id="heroStats">
      Loading sessions...
    </p>
  </section>

  <h3 class="section-title">Sessions</h3>

  <div class="card-list" id="sessionsList">
    <div class="empty-card glass-card">
      Loading sessions...
    </div>
  </div>

</main>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
const SUPABASE_URL =
  "https://woolaaiunapsaowheifj.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvb2xhYWl1bmFwc2Fvd2hlaWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMjAyNDEsImV4cCI6MjA5NTU5NjI0MX0.eBebW92-UHQVM8asBA6SwJql9s5DHgqhd0BlC00bUkc";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

function getParams() {
  return new URLSearchParams(window.location.search);
}

function getRole() {
  const role = getParams().get("role");
  return ["owner", "trainer", "parent"].includes(role) ? role : "owner";
}

function getDogId() {
  return getParams().get("dog");
}

function withRoleAndDog(page, dogId) {
  return `${page}?role=${role}&dog=${dogId}`;
}

const role = getRole();
const dogId = getDogId();

document.body.dataset.role = role;

function renderRoleCopy() {
  if (role === "owner") {
    document.getElementById("pageSubtitle").textContent =
      "Training attendance and progress.";
  }

  if (role === "trainer") {
    document.getElementById("pageSubtitle").textContent =
      "Attendance history and class participation.";
  }

  if (role === "parent") {
    document.getElementById("pageSubtitle").textContent =
      "A record of your dog's training sessions.";
  }
}

function renderBottomNav() {
  const nav = document.getElementById("bottomNav");

  if (role === "owner") {
    nav.innerHTML = `
      <a href="owner-dashboard.html" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="layout-dashboard"></i></div>
        Home
      </a>

      <a href="owner-dashboard.html#programs" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="layers-3"></i></div>
        Programs
      </a>

      <a href="dogs.html?role=owner" class="bottom-nav-item active">
        <div class="bottom-nav-icon"><i data-lucide="users"></i></div>
        People
      </a>

      <a href="owner-dashboard.html#school" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="building-2"></i></div>
        School
      </a>
    `;
  }

  if (role === "trainer") {
    nav.innerHTML = `
      <a href="trainer-dashboard.html" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="calendar-check"></i></div>
        Sessions
      </a>

      <a href="dogs.html?role=trainer" class="bottom-nav-item active">
        <div class="bottom-nav-icon"><i data-lucide="dog"></i></div>
        Dogs
      </a>
    `;
  }

  function setBackButton() {
  document.getElementById("backBtn").onclick = () => {

    if (role === "parent") {
      window.location = "parent-dashboard.html";
      return;
    }

    if (role === "owner") {
      window.location = "dogs.html?role=owner";
      return;
    }

    if (role === "trainer") {
      window.location = "dogs.html?role=trainer";
      return;
    }

    window.location = "dogs.html";
  };
}
}

function setBackButton() {
  document.getElementById("backBtn").onclick = () => {
    if (role === "parent") {
      window.location = "parent-dashboard.html";
      return;
    }

    if (role === "owner") {
      window.location = "dogs.html?role=owner";
      return;
    }

    if (role === "trainer") {
      window.location = "dogs.html?role=trainer";
      return;
    }

    window.location = "dogs.html";
  };
}

async function loadDogName(dogId) {
  if (!dogId) return "Dog";

  const { data, error } = await db
    .from("dogs")
    .select("name")
    .eq("id", dogId)
    .single();

  if (error || !data) {
    return "Dog";
  }

  return data.name || "Dog";
}

async function loadSessions() {
  renderRoleCopy();
  renderBottomNav();
  setBackButton();

  if (!dogId) {
    document.getElementById("dogName").textContent =
      "Dog not found";

    document.getElementById("heroStats").textContent =
      "Open this page from the parent dashboard.";

    document.getElementById("sessionsList").innerHTML = `
      <div class="empty-card glass-card">
        No dog was selected.
      </div>
    `;

    lucide.createIcons();
    return;
  }

  const dogName = await loadDogName(dogId);

  document.getElementById("dogName").textContent =
    dogName;

  const { data, error } = await db
    .from("owner_dog_sessions_view")
    .select("*")
    .eq("dog_id", dogId)
    .order("checked_in_at", { ascending: false });

  console.log("DOG ID:", dogId);
  console.log("SESSIONS:", data);
  console.log("ERROR:", error);

  if (error) {
    console.error("Sessions failed:", error);

    document.getElementById("heroStats").textContent =
      "Could not load sessions.";

    document.getElementById("sessionsList").innerHTML = `
      <div class="empty-card glass-card">
        Sessions could not be loaded. Please try again.
      </div>
    `;

    lucide.createIcons();
    return;
  }

  if (!data || data.length === 0) {
    document.getElementById("heroStats").textContent =
      "No sessions recorded yet.";

    document.getElementById("sessionsList").innerHTML = `
      <div class="empty-card glass-card">
        No sessions recorded for ${dogName} yet.
      </div>
    `;

    lucide.createIcons();
    return;
  }

  document.getElementById("dogName").textContent =
    data[0].dog_name || dogName;

  document.getElementById("heroStats").textContent =
    `${data.length} session${data.length === 1 ? "" : "s"} attended`;

  document.getElementById("sessionsList").innerHTML =
    data.map(session => `
      <div class="session-card glass-card lift-card">

        <div class="session-header">
          <div class="session-title">
            ${session.class_name || "Training Session"}
          </div>

          <div class="status-pill">
            ${session.status || "present"}
          </div>
        </div>

        <div class="session-meta">
          Program: ${session.program_name || "Program"}<br>
          Checked in:
          ${session.checked_in_at
            ? new Date(session.checked_in_at).toLocaleDateString("en-AU")
            : "-"}
        </div>

      </div>
    `).join("");

  lucide.createIcons();
}

loadSessions();
lucide.createIcons();
</script>

</body>
</html>
