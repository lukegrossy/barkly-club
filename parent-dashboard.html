<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Parent Portal | Barkly Schools</title>

  <link rel="stylesheet" href="design-system.css" />

  <style>
    body {
      padding: max(26px, env(safe-area-inset-top)) 20px 110px;
    }

    .dashboard {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: var(--space-lg);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .eyebrow {
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      color: var(--sage);
      margin: 0;
    }

    .topbar h1 {
      font-size: var(--display-md);
      line-height: 1.02;
      letter-spacing: var(--tracking-display);
      margin-bottom: var(--space-sm);
    }

    .topbar-copy {
      font-size: var(--text-md);
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-pill);
      background: var(--navy);
      color: white;
      display: grid;
      place-items: center;
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      flex-shrink: 0;
    }

    .dog-switcher {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      margin-bottom: var(--space-lg);
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.62);
      border: 1.5px solid var(--glass-border);
      color: var(--navy);
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      box-shadow: var(--shadow-soft);
      backdrop-filter: var(--blur-md);
      text-decoration: none;
    }

    .dog-switcher svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.4;
    }

    .dog-profile {
      display: block;
      padding: 22px;
      margin-bottom: var(--space-xl);
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .dog-avatar {
      width: 108px;
      height: 108px;
      margin: 0 auto var(--space-md);
      border-radius: var(--radius-xl);
      background: rgba(138,166,143,0.12);
      color: var(--sage);
      display: grid;
      place-items: center;
    }

    .dog-avatar svg {
      width: 54px;
      height: 54px;
      stroke-width: 1.9;
    }

    .dog-profile h2 {
      font-size: var(--display-sm);
      letter-spacing: var(--tracking-tight);
      margin-bottom: 4px;
    }

    .dog-profile p {
      color: var(--text-secondary);
      font-size: var(--text-md);
      line-height: 1.45;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-sm);
    }

    .section-head h3 {
      font-size: var(--text-xl);
      letter-spacing: var(--tracking-tight);
    }

    .section-head a {
      text-decoration: none;
      color: var(--sage);
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }

    .parent-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
    }

    .parent-card-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: rgba(138,166,143,0.12);
      color: var(--sage);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .parent-card-icon svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.2;
    }

    .parent-card h4 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .parent-card p {
      font-size: var(--text-sm);
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .row-status {
      margin-left: auto;
      color: var(--sage);
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .journey-card {
      padding: 18px;
      margin-bottom: var(--space-xl);
    }

    .journey-track {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      position: relative;
    }

    .journey-track::before {
      content: "";
      position: absolute;
      top: 17px;
      left: 10%;
      right: 10%;
      height: 2px;
      background: rgba(15,31,46,0.08);
    }

    .journey-step {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: 10.5px;
      font-weight: var(--font-bold);
      color: var(--text-secondary);
    }

    .journey-dot {
      width: 34px;
      height: 34px;
      margin: 0 auto 8px;
      border-radius: var(--radius-pill);
      background: var(--glass-strong);
      border: 1.5px solid var(--glass-border);
      display: grid;
      place-items: center;
      color: var(--text-secondary);
      font-weight: var(--font-heavy);
    }

    .journey-step.done .journey-dot {
      background: var(--sage);
      border-color: var(--sage);
      color: white;
    }

    .journey-step.current .journey-dot {
      background: var(--navy);
      border-color: var(--navy);
      color: white;
      box-shadow: var(--shadow-soft);
    }

    .journey-dot svg {
      width: 16px;
      height: 16px;
      stroke-width: 2.5;
    }

    .badges-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }

    .badge-card {
      min-height: 112px;
      padding: 14px 8px;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .badge-mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 10px;
      border-radius: var(--radius-md);
      background: rgba(138,166,143,0.14);
      color: var(--sage);
      display: grid;
      place-items: center;
    }

    .badge-mark svg {
      width: 23px;
      height: 23px;
      stroke-width: 2.2;
    }

    .badge-card span {
      display: block;
      font-size: var(--text-xs);
      font-weight: var(--font-heavy);
      line-height: 1.2;
    }

    .empty-card {
      padding: 16px;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.45;
    }

    .bottom-nav {
      max-width: 540px;
    }

    .bottom-nav-item {
      min-width: 92px;
    }
  </style>
</head>

<body>

  <main class="dashboard fade-in">

    <header class="topbar">
      <div>
        <div class="brand-row">
          <img src="assets/barkly-icon.png" alt="Barkly" class="header-icon" />
          <p class="eyebrow">Barkly Schools</p>
        </div>

        <h1 id="greetingTitle">Good afternoon</h1>

        <p class="topbar-copy" id="greetingCopy">
          Loading your dog’s training journey.
        </p>
      </div>

      <div class="avatar" id="parentAvatar">
        —
      </div>
    </header>

    <button class="dog-switcher" id="dogSwitcher" type="button">
      Loading dog
      <i data-lucide="chevron-down"></i>
    </button>

    <div class="dog-profile glass-card">
      <div class="dog-avatar">
        <i data-lucide="dog"></i>
      </div>

      <h2 id="dogName">Loading...</h2>

      <p id="dogProfileMeta">
        Loading profile.
      </p>
    </div>

    <section>
      <div class="section-head">
        <h3>Badges</h3>
        <a href="#" id="badgesLink">View all</a>
      </div>

      <div class="badges-grid" id="badgesGrid">
        <div class="empty-card glass-card">Loading badges...</div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h3>Training journey</h3>
      </div>

      <div class="journey-card glass-card">
        <div class="journey-track" id="journeyTrack"></div>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h3>Homework</h3>
      </div>

      <div class="card-list">
        <a href="#" id="homeworkLink" class="parent-card glass-card lift-card">
          <div class="parent-card-icon">
            <i data-lucide="clipboard-check"></i>
          </div>

          <div>
            <h4 id="homeworkTitle">This week’s homework</h4>
            <p id="homeworkText">Loading homework.</p>
          </div>

          <div class="row-status">View</div>
        </a>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h3>Trainer updates</h3>
      </div>

      <div class="card-list">
        <a href="#" id="latestUpdateLink" class="parent-card glass-card lift-card">
          <div class="parent-card-icon">
            <i data-lucide="message-circle"></i>
          </div>

          <div>
            <h4 id="latestUpdateTitle">Latest update</h4>
            <p id="latestUpdateText">Loading trainer update.</p>
          </div>

          <div class="row-status">View</div>
        </a>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">

    <a href="parent-dashboard.html" id="homeNavLink" class="bottom-nav-item active">
      <div class="bottom-nav-icon">
        <i data-lucide="home"></i>
      </div>
      Home
    </a>

    <a href="#" id="sessionsNavLink" class="bottom-nav-item">
      <div class="bottom-nav-icon">
        <i data-lucide="calendar-check"></i>
      </div>
      Sessions
    </a>

    <a href="#" id="schoolNavLink" class="bottom-nav-item">
      <div class="bottom-nav-icon">
        <i data-lucide="building-2"></i>
      </div>
      School
    </a>

  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    const SUPABASE_URL = "https://woolaaiunapsaowheifj.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvb2xhYWl1bmFwc2Fvd2hlaWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMjAyNDEsImV4cCI6MjA5NTU5NjI0MX0.eBebW92-UHQVM8asBA6SwJql9s5DHgqhd0BlC00bUkc";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function safe(value, fallback = "") {
      return value ?? fallback;
    }

    function dogLink(page, dogId) {
      return `${page}?role=parent&dog=${dogId}`;
    }

    function initials(name) {
      if (!name) return "P";
      return name
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0])
        .join("")
        .toUpperCase();
    }

    function badgeIcon(name, icon) {
      if (icon) return icon;

      switch (name) {
        case "First Session":
          return "sparkles";
        case "Recall Rookie":
          return "radio";
        case "Lead Walker":
          return "footprints";
        case "Social Star":
          return "star";
        case "Graduate":
          return "badge-check";
        case "Off Leash Ready":
          return "lock";
        default:
          return "badge-check";
      }
    }

    function renderBadgeCard(badge) {
      const name =
        badge.badge_name ||
        badge.name ||
        badge.badge_templates?.name ||
        "Badge";

      const icon =
        badge.icon ||
        badge.badge_templates?.icon ||
        badgeIcon(name);

      return `
        <a href="#" class="badge-card glass-card lift-card">
          <div class="badge-mark">
            <i data-lucide="${icon}"></i>
          </div>
          <span>${name}</span>
        </a>
      `;
    }

    function renderJourney(sessionCount) {
      const totalSessions = 6;
      const completed = Math.min(sessionCount || 0, totalSessions);

      let steps = [];

      for (let i = 1; i <= totalSessions; i++) {
        const done = i <= completed;
        const isCurrent = i === completed + 1 && completed < totalSessions;

        steps.push({
          number: i,
          label:
            i === 1
              ? "Start"
              : i === totalSessions
                ? "Graduate"
                : "",
          done,
          current: isCurrent
        });
      }

      document.getElementById("journeyTrack").innerHTML =
        steps.map(step => `
          <div class="journey-step ${step.done ? "done" : step.current ? "current" : ""}">
            <div class="journey-dot">
              ${step.done ? `<i data-lucide="check"></i>` : step.current ? step.number : ""}
            </div>
            ${step.label}
          </div>
        `).join("");
    }

    async function loadParentDashboard() {
      const { data, error } = await db
        .from("parent_dashboard_view")
        .select("*")
        .limit(1)
        .single();

      if (error || !data) {
        console.error("Parent dashboard failed:", error);
        document.getElementById("greetingCopy").textContent =
          "Could not load the parent dashboard.";
        lucide.createIcons();
        return;
      }

      const dogId = data.dog_id;
      const dogName = safe(data.dog_name, "Dog");
      const ownerName = safe(data.owner_name, "Parent");
      const breed = safe(data.breed, "");
      const programName = safe(data.program_name, data.class_name || "Training program");
      const className = safe(data.class_name, "");
      const updateTitle = safe(data.latest_update_title, "Latest update");
      const updateText = safe(data.latest_update, "No trainer update yet.");
      const homeworkTitle = safe(data.homework_title, "This week’s homework");
      const homeworkText = safe(data.homework_instructions, "No homework assigned yet.");

      const parentFirstName =
        ownerName.split(" ")[0] || "there";

      document.getElementById("greetingTitle").innerHTML =
        `Good afternoon,<br />${parentFirstName}`;

      document.getElementById("greetingCopy").textContent =
        `${dogName}'s training journey is ready.`;

      document.getElementById("parentAvatar").textContent =
        initials(ownerName);

      document.getElementById("dogSwitcher").innerHTML =
        `${dogName} <i data-lucide="chevron-down"></i>`;

      document.getElementById("dogName").textContent =
        dogName;

      document.getElementById("dogProfileMeta").innerHTML =
        `${breed || "Dog"}<br>${className || programName}`;

      document.getElementById("homeworkTitle").textContent =
        homeworkTitle;

      document.getElementById("homeworkText").textContent =
        homeworkText;

      document.getElementById("latestUpdateTitle").textContent =
        updateTitle;

      document.getElementById("latestUpdateText").textContent =
        updateText;

      if (dogId) {
        document.getElementById("homeNavLink").href =
          "parent-dashboard.html";

        document.getElementById("sessionsNavLink").href =
          dogLink("dog-sessions.html", dogId);

        document.getElementById("schoolNavLink").href =
          "#";

        document.getElementById("schoolNavLink").onclick = event => {
          event.preventDefault();
          alert("School page coming next.");
        };

        document.getElementById("badgesLink").href =
          dogLink("dog-badges.html", dogId);

        document.getElementById("latestUpdateLink").href =
          dogLink("dog-notes.html", dogId);

        document.getElementById("homeworkLink").href =
          dogLink("dog-homework.html", dogId);
      }

      const { count: sessionCount } = await db
        .from("session_attendance")
        .select("*", { count: "exact", head: true })
        .eq("dog_id", dogId)
        .eq("status", "present");

      renderJourney(sessionCount || 0);

      const { data: badgeRows, error: badgeError } = await db
        .from("owner_dog_badges_view")
        .select("*")
        .eq("dog_id", dogId)
        .eq("earned", true)
        .limit(6);

      const badgeGrid =
        document.getElementById("badgesGrid");

      if (badgeError) {
        console.error("Badges failed:", badgeError);
        badgeGrid.innerHTML =
          `<div class="empty-card glass-card">Could not load badges.</div>`;
      } else if (!badgeRows || badgeRows.length === 0) {
        badgeGrid.innerHTML =
          `<div class="empty-card glass-card">No badges earned yet.</div>`;
      } else {
        badgeGrid.innerHTML =
          badgeRows.map(renderBadgeCard).join("");
      }

      lucide.createIcons();
    }

    loadParentDashboard();
    lucide.createIcons();
  </script>

</body>
</html>
