<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dogs | Barkly Schools</title>

  <link rel="stylesheet" href="design-system.css" />

  <style>
    body {
      padding: max(26px, env(safe-area-inset-top)) 20px 110px;
    }

    .dashboard {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: var(--space-xl);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .eyebrow {
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      color: var(--sage);
      margin: 0;
    }

    .topbar h1 {
      font-size: var(--display-md);
      line-height: 1;
      letter-spacing: var(--tracking-display);
      margin-bottom: var(--space-sm);
    }

    .topbar-copy {
      font-size: var(--text-md);
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-pill);
      background: var(--navy);
      color: white;
      display: grid;
      place-items: center;
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      flex-shrink: 0;
    }

    .search {
      width: 100%;
      height: 56px;
      border: 1.5px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.72);
      padding: 0 16px;
      font-size: var(--text-md);
      outline: none;
      margin-bottom: var(--space-lg);
    }

    .section-head {
      margin-bottom: var(--space-sm);
    }

    .section-head h3 {
      font-size: var(--text-xl);
      letter-spacing: var(--tracking-tight);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }

    .dog-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: rgba(138,166,143,0.12);
      color: var(--sage);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .card-icon svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.2;
    }

    .dog-copy {
      min-width: 0;
      flex: 1;
    }

    .dog-card h4 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .dog-card p {
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.4;
    }

    .status-pill {
      margin-left: auto;
      padding: 8px 11px;
      border-radius: var(--radius-pill);
      background: rgba(138,166,143,0.12);
      color: var(--sage);
      font-size: var(--text-xs);
      font-weight: var(--font-heavy);
      white-space: nowrap;
      text-transform: capitalize;
    }

    .bottom-nav {
      max-width: 540px;
    }

    .bottom-nav-item {
      min-width: 62px;
    }

    .empty-card {
      padding: 18px;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="dashboard fade-in">

    <header class="topbar">
      <div>
        <div class="brand-row">
          <img src="assets/barkly-icon.png" alt="Barkly" class="header-icon" />
          <p class="eyebrow">Barkly Schools</p>
        </div>

        <h1>Dogs</h1>

        <p class="topbar-copy">
          View enrolled dogs, class placement and program progress.
        </p>
      </div>

      <div class="avatar">LG</div>
    </header>

    <input
      class="search"
      id="dogSearch"
      type="search"
      placeholder="Search dogs..."
    />

    <section>
      <div class="section-head">
        <h3>All dogs</h3>
      </div>

      <div class="card-list" id="dogsList">
        <div class="empty-card glass-card">
          Loading dogs...
        </div>
      </div>
    </section>

  </main>

  <nav class="bottom-nav">

    <a href="owner-dashboard.html" class="bottom-nav-item">
      <div class="bottom-nav-icon">
        <i data-lucide="layout-dashboard"></i>
      </div>
      Home
    </a>

    <a href="owner-dashboard.html#programs" class="bottom-nav-item">
      <div class="bottom-nav-icon">
        <i data-lucide="layers-3"></i>
      </div>
      Programs
    </a>

    <a href="dogs.html" class="bottom-nav-item active">
      <div class="bottom-nav-icon">
        <i data-lucide="dog"></i>
      </div>
      Dogs
    </a>

    <a href="owner-dashboard.html#school" class="bottom-nav-item">
      <div class="bottom-nav-icon">
        <i data-lucide="building-2"></i>
      </div>
      School
    </a>

  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    const SUPABASE_URL = "https://woolaaiunapsaowheifj.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvb2xhYWl1bmFwc2Fvd2hlaWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMjAyNDEsImV4cCI6MjA5NTU5NjI0MX0.eBebW92-UHQVM8asBA6SwJql9s5DHgqhd0BlC00bUkc";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allDogs = [];

    function safe(value, fallback = "") {
      return value ?? fallback;
    }

    async function loadDogs() {
      const { data, error } = await db
        .from("owner_dogs_view")
        .select("*")
        .order("dog_name", { ascending: true });

      if (error) {
        console.error("Dogs failed:", error);
        document.getElementById("dogsList").innerHTML = `
          <div class="empty-card glass-card">
            Could not load dogs.
          </div>
        `;
        return;
      }

      allDogs = data || [];
      renderDogs();
    }

    function renderDogs() {
      const list = document.getElementById("dogsList");
      const search = document.getElementById("dogSearch").value.toLowerCase();

      const filteredDogs = allDogs.filter(dog => {
        const text = `
          ${dog.dog_name || ""}
          ${dog.breed || ""}
          ${dog.class_name || ""}
          ${dog.program_name || ""}
        `.toLowerCase();

        return text.includes(search);
      });

      if (filteredDogs.length === 0) {
        list.innerHTML = `
          <div class="empty-card glass-card">
            No dogs found.
          </div>
        `;
        return;
      }

      list.innerHTML = filteredDogs.map(dog => `
        <a href="owner-dog-detail.html?dog=${dog.dog_id}"
           class="dog-card glass-card lift-card">

          <div class="card-icon">
            <i data-lucide="dog"></i>
          </div>

          <div class="dog-copy">
            <h4>${safe(dog.dog_name, "Dog")}</h4>
            <p>
              ${safe(dog.breed, "Dog")}
              ·
              ${safe(dog.program_name, "No program")}
              ·
              ${safe(dog.class_name, "No class")}
            </p>
          </div>

          <span class="status-pill">
            ${safe(dog.status, "active")}
          </span>

        </a>
      `).join("");

      lucide.createIcons();
    }

    document.getElementById("dogSearch").addEventListener("input", renderDogs);

    loadDogs();
    lucide.createIcons();
  </script>

</body>
</html>
