<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Classes | Barkly Schools</title>

  <link rel="stylesheet" href="design-system.css" />

  <style>
    body {
      padding: max(26px, env(safe-area-inset-top)) 20px 110px;
    }

    .dashboard {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .topbar {
      margin-bottom: var(--space-xl);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .eyebrow {
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      color: var(--sage);
      margin: 0;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.72);
      border: 1.5px solid var(--glass-border);
      color: var(--navy);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
    }

    .topbar h1 {
      font-size: var(--display-md);
      line-height: 1;
      letter-spacing: var(--tracking-display);
      margin-bottom: var(--space-sm);
    }

    .topbar-copy {
      font-size: var(--text-md);
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .search {
      width: 100%;
      height: 56px;
      border: 1.5px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.72);
      padding: 0 16px;
      font-size: var(--text-md);
      outline: none;
      margin-bottom: var(--space-lg);
    }

    .section-head {
      margin-bottom: var(--space-sm);
    }

    .section-head h3 {
      font-size: var(--text-xl);
      letter-spacing: var(--tracking-tight);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }

    .class-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      text-decoration: none;
      color: inherit;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: rgba(138,166,143,0.12);
      color: var(--sage);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .card-icon svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.2;
    }

    .class-copy {
      min-width: 0;
      flex: 1;
    }

    .class-card h4 {
      font-size: 16px;
      margin-bottom: 4px;
      line-height: 1.25;
    }

    .class-card p {
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.4;
    }

    .status-pill {
      margin-left: auto;
      padding: 8px 11px;
      border-radius: var(--radius-pill);
      background: rgba(138,166,143,0.12);
      color: var(--sage);
      font-size: var(--text-xs);
      font-weight: var(--font-heavy);
      white-space: nowrap;
      text-transform: capitalize;
    }

    .empty-card {
      padding: 18px;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.5;
    }

    .bottom-nav {
      max-width: 540px;
    }

    .bottom-nav-item {
      min-width: 62px;
    }
  </style>
</head>

<body data-role="owner">

  <main class="dashboard fade-in">

    <header class="topbar">
      <div class="brand-row">
        <button class="back-btn" id="backBtn">
          <i data-lucide="arrow-left"></i>
        </button>

        <img src="assets/barkly-icon.png" alt="Barkly" class="header-icon" />
        <p class="eyebrow">Barkly Schools</p>
      </div>

      <h1>Classes</h1>

      <p class="topbar-copy" id="pageSubtitle">
        View active class groups, enrolments and attendance.
      </p>
    </header>

    <input
      class="search"
      id="classSearch"
      type="search"
      placeholder="Search classes..."
    />

    <section>
      <div class="section-head">
        <h3>Active classes</h3>
      </div>

      <div class="card-list" id="classesList">
        <div class="empty-card glass-card">
          Loading classes...
        </div>
      </div>
    </section>

  </main>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    const SUPABASE_URL = "https://woolaaiunapsaowheifj.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvb2xhYWl1bmFwc2Fvd2hlaWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMjAyNDEsImV4cCI6MjA5NTU5NjI0MX0.eBebW92-UHQVM8asBA6SwJql9s5DHgqhd0BlC00bUkc";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function getParams() {
      return new URLSearchParams(window.location.search);
    }

    function getRole() {
      const role = getParams().get("role");
      return ["owner", "trainer", "parent"].includes(role) ? role : "owner";
    }

    const role = getRole();

    document.body.dataset.role = role;

    let allClasses = [];

    function safe(value, fallback = "") {
      return value ?? fallback;
    }

    function renderRoleCopy() {
      if (role === "owner") {
        document.getElementById("pageSubtitle").textContent =
          "View active class groups, enrolments and attendance.";
      }

      if (role === "trainer") {
        document.getElementById("pageSubtitle").textContent =
          "View class groups, attendance and enrolled dogs.";
      }

      if (role === "parent") {
        document.getElementById("pageSubtitle").textContent =
          "View class information and training schedule.";
      }
    }

    function renderBottomNav() {
      const nav = document.getElementById("bottomNav");

      if (role === "owner") {
        nav.innerHTML = `
          <a href="owner-dashboard.html" class="bottom-nav-item">
            <div class="bottom-nav-icon">
              <i data-lucide="layout-dashboard"></i>
            </div>
            Home
          </a>

          <a href="owner-dashboard.html#programs" class="bottom-nav-item">
            <div class="bottom-nav-icon">
              <i data-lucide="layers-3"></i>
            </div>
            Programs
          </a>

          <a href="dogs.html?role=owner" class="bottom-nav-item">
            <div class="bottom-nav-icon">
              <i data-lucide="users"></i>
            </div>
            People
          </a>

          <a href="owner-dashboard.html#school" class="bottom-nav-item active">
            <div class="bottom-nav-icon">
              <i data-lucide="building-2"></i>
            </div>
            School
          </a>
        `;
      }

      if (role === "trainer") {
        nav.innerHTML = `
          <a href="trainer-dashboard.html" class="bottom-nav-item">
            <div class="bottom-nav-icon">
              <i data-lucide="calendar-check"></i>
            </div>
            Sessions
          </a>

          <a href="dogs.html?role=trainer" class="bottom-nav-item">
            <div class="bottom-nav-icon">
              <i data-lucide="dog"></i>
            </div>
            Dogs
          </a>

          <a href="trainer-school.html" class="bottom-nav-item active">
            <div class="bottom-nav-icon">
              <i data-lucide="building-2"></i>
            </div>
            School
          </a>
        `;
      }

      if (role === "parent") {
        nav.innerHTML = `
          <a href="parent-dashboard.html" class="bottom-nav-item">
            <div class="bottom-nav-icon">
              <i data-lucide="dog"></i>
            </div>
            Dog
          </a>

          <a href="parent-sessions.html" class="bottom-nav-item">
            <div class="bottom-nav-icon">
              <i data-lucide="calendar-check"></i>
            </div>
            Sessions
          </a>

          <a href="parent-school.html" class="bottom-nav-item active">
            <div class="bottom-nav-icon">
              <i data-lucide="building-2"></i>
            </div>
            School
          </a>
        `;
      }
    }

    function setBackButton() {
      document.getElementById("backBtn").onclick = () => {
        if (role === "owner") {
          window.location = "owner-dashboard.html#school";
          return;
        }

        if (role === "trainer") {
          window.location = "trainer-school.html";
          return;
        }

        if (role === "parent") {
          window.location = "parent-school.html";
          return;
        }

        window.location = "owner-dashboard.html";
      };
    }

    async function loadClasses() {
      const { data, error } = await db
        .from("owner_class_full_detail_view")
        .select("*")
        .order("class_name", { ascending: true });

      if (error) {
        console.error("Classes failed:", error);
        document.getElementById("classesList").innerHTML = `
          <div class="empty-card glass-card">
            Could not load classes.
          </div>
        `;
        return;
      }

      allClasses = data || [];
      renderClasses();
    }

    function renderClasses() {
      const list = document.getElementById("classesList");
      const search = document.getElementById("classSearch").value.toLowerCase();

      const filteredClasses = allClasses.filter(classItem => {
        const text = `
          ${classItem.class_name || ""}
          ${classItem.program_name || ""}
          ${classItem.location || ""}
          ${classItem.status || ""}
        `.toLowerCase();

        return text.includes(search);
      });

      if (filteredClasses.length === 0) {
        list.innerHTML = `
          <div class="empty-card glass-card">
            No classes found.
          </div>
        `;
        return;
      }

      list.innerHTML = filteredClasses.map(classItem => {
        const enrolled = Number(classItem.enrolled_dogs || 0);
        const capacity = Number(classItem.capacity || 0);
        const attendance = Number(classItem.attendance_rate || 0);

        return `
          <a href="class-detail.html?role=${role}&class=${classItem.class_id}"
             class="class-card glass-card lift-card">

            <div class="card-icon">
              <i data-lucide="calendar-check"></i>
            </div>

            <div class="class-copy">
              <h4>${safe(classItem.class_name, "Class")}</h4>
              <p>
                ${safe(classItem.location, "Location")}
                ·
                ${safe(classItem.program_name, "Program")}
                ·
                ${enrolled}/${capacity} enrolled
                ·
                ${attendance}% attendance
              </p>
            </div>

            <span class="status-pill">
              ${safe(classItem.status, "active")}
            </span>

          </a>
        `;
      }).join("");

      lucide.createIcons();
    }

    document.getElementById("classSearch").addEventListener("input", renderClasses);

    renderRoleCopy();
    renderBottomNav();
    setBackButton();
    loadClasses();
    lucide.createIcons();
  </script>

</body>
</html>
