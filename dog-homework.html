<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dog Homework | Barkly Schools</title>

  <link rel="stylesheet" href="design-system.css" />

  <style>
    body {
      padding: max(26px, env(safe-area-inset-top)) 20px 100px;
    }

    .dashboard {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .eyebrow {
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      color: var(--sage);
      margin: 0;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.72);
      border: 1.5px solid var(--glass-border);
      color: var(--navy);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
    }

    .page-title {
      font-size: var(--display-md);
      line-height: 1;
      margin-bottom: 8px;
    }

    .page-subtitle {
      color: var(--text-secondary);
      margin-bottom: var(--space-xl);
    }

    .hero {
      padding: 24px;
      margin-bottom: var(--space-xl);
      color: white;
    }

    .hero h2 {
      color: white;
      margin-bottom: 8px;
    }

    .hero p {
      color: rgba(255,255,255,.75);
    }

    .section-title {
      font-size: var(--text-xl);
      margin-bottom: var(--space-sm);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }

    .homework-card {
      display: flex;
      gap: 14px;
      padding: 18px;
      align-items: flex-start;
    }

    .homework-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: rgba(138,166,143,.15);
      color: var(--sage);
    }

    .homework-icon svg {
      width: 26px;
      height: 26px;
      stroke-width: 2.2;
    }

    .homework-copy {
      flex: 1;
      min-width: 0;
    }

    .homework-copy h4 {
      margin-bottom: 6px;
      font-size: 16px;
    }

    .homework-date {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .homework-instructions {
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 7px 10px;
      border-radius: var(--radius-pill);
      background: rgba(138,166,143,.12);
      color: var(--sage);
      font-size: var(--text-xs);
      font-weight: var(--font-heavy);
      text-transform: capitalize;
    }

    .empty-card {
      padding: 18px;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.5;
    }
  </style>
</head>

<body>

<main class="dashboard fade-in">

  <div class="brand-row">
    <button class="back-btn" onclick="window.location='dog-detail.html'">
      ←
    </button>

    <img src="assets/barkly-icon.png" alt="Barkly" class="header-icon" />
    <p class="eyebrow">Barkly Schools</p>
  </div>

  <h1 class="page-title">Homework</h1>

  <p class="page-subtitle">
    Practice tasks and trainer guidance.
  </p>

  <section class="hero hero-card lift-card">
    <h2 id="dogName">Loading...</h2>

    <p id="heroStats">
      Loading homework...
    </p>
  </section>

  <h3 class="section-title">Assigned homework</h3>

  <div class="card-list" id="homeworkList">
    <div class="empty-card glass-card">
      Loading homework...
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
const SUPABASE_URL =
  "https://woolaaiunapsaowheifj.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvb2xhYWl1bmFwc2Fvd2hlaWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMjAyNDEsImV4cCI6MjA5NTU5NjI0MX0.eBebW92-UHQVM8asBA6SwJql9s5DHgqhd0BlC00bUkc";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function loadHomework() {
  const { data, error } = await db
    .from("owner_dog_homework_view")
    .select("*")
    .order("assigned_at", { ascending: false });

  if (error) {
    console.error(error);
    return;
  }

  if (!data || data.length === 0) {
    document.getElementById("dogName").textContent =
      "Dog";

    document.getElementById("heroStats").textContent =
      "No homework assigned yet.";

    document.getElementById("homeworkList").innerHTML =
      `<div class="empty-card glass-card">No homework assigned yet.</div>`;

    return;
  }

  const dogId = data[0].dog_id;

  const homeworkRows = data.filter(
    row => row.dog_id === dogId
  );

  const dogName =
    homeworkRows[0]?.dog_name || "Dog";

  document.getElementById("dogName").textContent =
    dogName;

  document.getElementById("heroStats").textContent =
    `${homeworkRows.length} homework assignment${homeworkRows.length === 1 ? "" : "s"} recorded`;

  const list =
    document.getElementById("homeworkList");

  list.innerHTML =
    homeworkRows.map(item => `
      <div class="homework-card glass-card lift-card">

        <div class="homework-icon">
          <i data-lucide="clipboard-check"></i>
        </div>

        <div class="homework-copy">

          <h4>${item.title || "Homework"}</h4>

          <div class="homework-date">
            ${item.assigned_at
              ? new Date(item.assigned_at).toLocaleDateString("en-AU")
              : ""}
          </div>

          <div class="homework-instructions">
            ${item.instructions || "No instructions provided."}
          </div>

          <span class="status-pill">
            ${item.status || "assigned"}
          </span>

        </div>

      </div>
    `).join("");

  lucide.createIcons();
}

loadHomework();
lucide.createIcons();
</script>

</body>
</html>
