<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dog Homework | Barkly Schools</title>

  <link rel="stylesheet" href="design-system.css" />

  <style>
    body {
      padding: max(26px, env(safe-area-inset-top)) 20px 110px;
    }

    .dashboard {
      max-width: var(--content-width);
      margin: 0 auto;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .header-icon {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .eyebrow {
      font-size: var(--text-sm);
      font-weight: var(--font-heavy);
      color: var(--sage);
      margin: 0;
    }

    .back-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.72);
      border: 1.5px solid var(--glass-border);
      color: var(--navy);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
    }

    .page-title {
      font-size: var(--display-md);
      line-height: 1;
      margin-bottom: 8px;
    }

    .page-subtitle {
      color: var(--text-secondary);
      margin-bottom: var(--space-xl);
    }

    .hero {
      padding: 24px;
      margin-bottom: var(--space-xl);
      color: white;
    }

    .hero h2 {
      color: white;
      margin-bottom: 8px;
    }

    .hero p {
      color: rgba(255,255,255,.75);
    }

    .section-title {
      font-size: var(--text-xl);
      margin-bottom: var(--space-sm);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-xl);
    }

    .homework-card {
      display: flex;
      gap: 14px;
      padding: 18px;
      align-items: flex-start;
    }

    .homework-icon {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: rgba(138,166,143,.15);
      color: var(--sage);
    }

    .homework-icon svg {
      width: 26px;
      height: 26px;
      stroke-width: 2.2;
    }

    .homework-copy {
      flex: 1;
      min-width: 0;
    }

    .homework-copy h4 {
      margin-bottom: 6px;
      font-size: 16px;
    }

    .homework-date {
      font-size: var(--text-xs);
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .homework-instructions {
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 7px 10px;
      border-radius: var(--radius-pill);
      background: rgba(138,166,143,.12);
      color: var(--sage);
      font-size: var(--text-xs);
      font-weight: var(--font-heavy);
      text-transform: capitalize;
    }

    .empty-card {
      padding: 18px;
      color: var(--text-secondary);
      font-size: var(--text-sm);
      line-height: 1.5;
    }

    .assignment-panel {
      display: none;
      padding: 18px;
      margin-bottom: var(--space-xl);
    }

    body[data-role="owner"] .assignment-panel,
    body[data-role="trainer"] .assignment-panel {
      display: block;
    }

    .assignment-panel h3 {
      margin-bottom: var(--space-sm);
    }

    .homework-title-input,
    .homework-textarea {
      width: 100%;
      border: 1.5px solid var(--glass-border);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,0.72);
      padding: 14px;
      font-family: var(--font-family);
      font-size: var(--text-md);
      outline: none;
      margin-bottom: 12px;
    }

    .homework-title-input {
      height: 52px;
    }

    .homework-textarea {
      min-height: 110px;
      resize: vertical;
    }

    .assign-homework-btn {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: var(--radius-pill);
      background: var(--navy);
      color: white;
      font-size: var(--text-md);
      font-weight: var(--font-heavy);
    }

    .bottom-nav {
      max-width: 540px;
    }

    .bottom-nav-item {
      min-width: 62px;
    }

    body[data-role="trainer"] .bottom-nav {
      max-width: 340px;
    }

    body[data-role="trainer"] .bottom-nav-item {
      min-width: 96px;
    }
  </style>
</head>

<body data-role="owner">

<main class="dashboard fade-in">

  <div class="brand-row">
    <button class="back-btn" id="backBtn">
      ←
    </button>

    <img src="assets/barkly-icon.png" alt="Barkly" class="header-icon" />
    <p class="eyebrow">Barkly Schools</p>
  </div>

  <h1 class="page-title">Homework</h1>

  <p class="page-subtitle" id="pageSubtitle">
    Practice tasks and trainer guidance.
  </p>

  <section class="hero hero-card lift-card">
    <h2 id="dogName">Loading...</h2>

    <p id="heroStats">
      Loading homework...
    </p>
  </section>

  <section class="assignment-panel glass-card lift-card" id="assignmentPanel">
    <h3 class="section-title">Assign homework</h3>

    <input
      class="homework-title-input"
      id="newHomeworkTitle"
      type="text"
      placeholder="Homework title"
      value="Calm greeting practice"
    />

    <textarea
      class="homework-textarea"
      id="newHomeworkText"
      placeholder="Enter homework instructions..."
    ></textarea>

    <button class="assign-homework-btn" id="assignHomeworkBtn" type="button">
      Assign homework
    </button>
  </section>

  <h3 class="section-title">Assigned homework</h3>

  <div class="card-list" id="homeworkList">
    <div class="empty-card glass-card">
      Loading homework...
    </div>
  </div>

</main>

<nav class="bottom-nav" id="bottomNav"></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
const SUPABASE_URL =
  "https://woolaaiunapsaowheifj.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indvb2xhYWl1bmFwc2Fvd2hlaWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMjAyNDEsImV4cCI6MjA5NTU5NjI0MX0.eBebW92-UHQVM8asBA6SwJql9s5DHgqhd0BlC00bUkc";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

let currentDog = null;

function getParams() {
  return new URLSearchParams(window.location.search);
}

function getRole() {
  const role = getParams().get("role");
  return ["owner", "trainer", "parent"].includes(role) ? role : "owner";
}

function getDogId() {
  return getParams().get("dog");
}

function withRoleAndDog(page, dogId) {
  return `${page}?role=${role}&dog=${dogId}`;
}

const role = getRole();
const dogId = getDogId();

document.body.dataset.role = role;

function renderRoleCopy() {
  if (role === "owner") {
    document.getElementById("pageSubtitle").textContent =
      "View homework and assign new practice tasks.";
  }

  if (role === "trainer") {
    document.getElementById("pageSubtitle").textContent =
      "View homework and assign new practice tasks.";
  }

  if (role === "parent") {
    document.getElementById("pageSubtitle").textContent =
      "Practice work to support your dog's training at home.";
  }
}

function renderBottomNav() {
  const nav = document.getElementById("bottomNav");

  if (role === "owner") {
    nav.innerHTML = `
      <a href="owner-dashboard.html" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="layout-dashboard"></i></div>
        Home
      </a>

      <a href="owner-dashboard.html#programs" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="layers-3"></i></div>
        Programs
      </a>

      <a href="dogs.html?role=owner" class="bottom-nav-item active">
        <div class="bottom-nav-icon"><i data-lucide="users"></i></div>
        People
      </a>

      <a href="owner-dashboard.html#school" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="building-2"></i></div>
        School
      </a>
    `;
  }

  if (role === "trainer") {
    nav.innerHTML = `
      <a href="trainer-dashboard.html" class="bottom-nav-item">
        <div class="bottom-nav-icon"><i data-lucide="calendar-check"></i></div>
        Sessions
      </a>

      <a href="trainer-dashboard.html#dogs" class="bottom-nav-item active">
        <div class="bottom-nav-icon"><i data-lucide="dog"></i></div>
        Dogs
      </a>
    `;
  }

  if (role === "parent") {
  nav.innerHTML = `
    <a href="parent-dashboard.html" class="bottom-nav-item active">
      <div class="bottom-nav-icon"><i data-lucide="home"></i></div>
      Home
    </a>

    <a href="dog-sessions.html?role=parent&dog=${dogId || ""}" class="bottom-nav-item">
      <div class="bottom-nav-icon"><i data-lucide="calendar-check"></i></div>
      Sessions
    </a>

    <a href="#" class="bottom-nav-item" onclick="alert('School page coming next.'); return false;">
      <div class="bottom-nav-icon"><i data-lucide="building-2"></i></div>
      School
    </a>
  `;
}
}

function setBackButton() {
  document.getElementById("backBtn").onclick = () => {
    if (role === "parent") {
      window.location = "parent-dashboard.html";
      return;
    }

    if (role === "owner") {
      window.location = "dogs.html?role=owner";
      return;
    }

    if (role === "trainer") {
      window.location = "dogs.html?role=trainer";
      return;
    }

    window.location = "dogs.html";
  };
}
}

async function loadDogRecord() {
  if (!dogId) return null;

  const { data, error } = await db
    .from("dogs")
    .select("id, school_id, name")
    .eq("id", dogId)
    .single();

  if (error) {
    console.error("Dog lookup failed:", error);
    return null;
  }

  currentDog = data;
  return data;
}

async function assignHomework() {
  if (!(role === "owner" || role === "trainer")) return;

  if (!currentDog?.id || !currentDog?.school_id) {
    alert("No dog selected.");
    return;
  }

  const title =
    document.getElementById("newHomeworkTitle")?.value?.trim() ||
    "Trainer Homework";

  const instructions =
    document.getElementById("newHomeworkText")?.value?.trim();

  if (!instructions) {
    alert("Enter homework instructions.");
    return;
  }

  const { error } = await db
    .from("homework_assignments")
    .insert({
      school_id: currentDog.school_id,
      dog_id: currentDog.id,
      title,
      instructions
    });

  if (error) {
    console.error("Assign homework failed:", error);
    alert("Could not assign homework.");
    return;
  }

  alert("Homework assigned.");

  document.getElementById("newHomeworkText").value = "";

  await loadHomework();
}

async function loadHomework() {
  renderRoleCopy();
  renderBottomNav();
  setBackButton();

  if (!dogId) {
    document.getElementById("dogName").textContent =
      "Dog not found";

    document.getElementById("heroStats").textContent =
      "Open this page from a dog profile.";

    document.getElementById("homeworkList").innerHTML =
      `<div class="empty-card glass-card">No dog was selected.</div>`;

    lucide.createIcons();
    return;
  }

  await loadDogRecord();

  const { data, error } = await db
    .from("owner_dog_homework_view")
    .select("*")
    .eq("dog_id", dogId)
    .order("assigned_at", { ascending: false });

  if (error) {
    console.error(error);

    document.getElementById("dogName").textContent =
      currentDog?.name || "Could not load homework";

    document.getElementById("heroStats").textContent =
      "Please try again.";

    lucide.createIcons();
    return;
  }

  if (!data || data.length === 0) {
    document.getElementById("dogName").textContent =
      currentDog?.name || "Dog";

    document.getElementById("heroStats").textContent =
      "No homework assigned yet.";

    document.getElementById("homeworkList").innerHTML =
      `<div class="empty-card glass-card">No homework assigned yet.</div>`;

    lucide.createIcons();
    return;
  }

  const dogName =
    data[0]?.dog_name || currentDog?.name || "Dog";

  document.getElementById("dogName").textContent =
    dogName;

  document.getElementById("heroStats").textContent =
    `${data.length} homework assignment${data.length === 1 ? "" : "s"} recorded`;

  const list =
    document.getElementById("homeworkList");

  list.innerHTML =
    data.map(item => `
      <div class="homework-card glass-card lift-card">

        <div class="homework-icon">
          <i data-lucide="clipboard-check"></i>
        </div>

        <div class="homework-copy">

          <h4>${item.title || "Homework"}</h4>

          <div class="homework-date">
            ${item.assigned_at
              ? new Date(item.assigned_at).toLocaleDateString("en-AU")
              : ""}
          </div>

          <div class="homework-instructions">
            ${item.instructions || "No instructions provided."}
          </div>

          <span class="status-pill">
            ${item.status || "assigned"}
          </span>

        </div>

      </div>
    `).join("");

  lucide.createIcons();
}

document
  .getElementById("assignHomeworkBtn")
  .addEventListener("click", assignHomework);

loadHomework();
lucide.createIcons();
</script>

</body>
</html>
